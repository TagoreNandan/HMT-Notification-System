services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: monitor
      POSTGRES_DB: monitor
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  monitor:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://monitor:monitor@postgres:5432/monitor
      PORT: "8000"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
